services:
  ralph:
    build:
      context: ..
      dockerfile: ralph-claude-code-containerized/Dockerfile
    image: ralph-claude-code
    stdin_open: true
    tty: true
    working_dir: /workspace
    volumes:
      - ..:/workspace
      - ralph_claude_home:/root/.claude
      - ralph_gh_home:/root/.config/gh
    secrets:
      - source: github_pat
        target: github_pat

secrets:
  github_pat:
    environment: GITHUB_PAT

volumes:
  ralph_claude_home:
  ralph_gh_home:
