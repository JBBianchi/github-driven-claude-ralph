services:
  planner:
    build: .
    command: ["planner"]
    restart: unless-stopped
    environment:
      REPO_URL: ${REPO_URL}
      REPO_SLUG: ${REPO_SLUG}
      BASE_BRANCH: ${BASE_BRANCH:-main}
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL}
      PLANNER_POLL_INTERVAL_SECONDS: ${PLANNER_POLL_INTERVAL_SECONDS:-120}
      MAX_TURNS_PER_RUN: ${PLANNER_MAX_TURNS:-50}
      AGENT_PROVIDER: ${AGENT_PROVIDER:-claude}
      PLANNER_PROVIDER: ${PLANNER_PROVIDER:-}
      PLANNER_MODEL: ${PLANNER_MODEL:-}
      AGENT_MODEL: ${AGENT_MODEL:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-}
      CLAUDE_SUBAGENTS_ENABLED: ${CLAUDE_SUBAGENTS_ENABLED:-false}
      PLANNER_AUTONOMOUS_MODE: ${PLANNER_AUTONOMOUS_MODE:-false}
      PLANNER_AUTONOMOUS_MAX_FEATURES: ${PLANNER_AUTONOMOUS_MAX_FEATURES:-3}
      PLANNER_AUTONOMOUS_FOCUS: ${PLANNER_AUTONOMOUS_FOCUS:-}
      PLANNER_MAX_CONCURRENT_PLANS: ${PLANNER_MAX_CONCURRENT_PLANS:-0}
      GIT_COMMIT_SIGNING: ${GIT_COMMIT_SIGNING:-off}
      GIT_SIGNING_KEY: ${GIT_SIGNING_KEY:-}
      SIGNING_KEYS_MOUNT: /mnt/host-keys
      RLM_PLUGIN_ENABLED: ${RLM_PLUGIN_ENABLED:-true}
      RLM_PLUGIN_REQUIRED: ${RLM_PLUGIN_REQUIRED:-true}
      RLM_PLUGIN_REF: ${RLM_PLUGIN_REF:-rlm-claude-code@rlm-claude-code}
      RLM_PLUGIN_KEY: ${RLM_PLUGIN_KEY:-rlm-claude-code@rlm-claude-code}
      RLM_PLUGIN_NAME: ${RLM_PLUGIN_NAME:-rlm-claude-code}
      RLM_PLUGIN_SCOPE: ${RLM_PLUGIN_SCOPE:-user}
      RLM_MARKETPLACE_SOURCE: ${RLM_MARKETPLACE_SOURCE:-rand/rlm-claude-code}
      RLM_PLUGIN_BUILD_HOOKS: ${RLM_PLUGIN_BUILD_HOOKS:-true}
      RLM_PLUGIN_SYNC_REQUIRED: ${RLM_PLUGIN_SYNC_REQUIRED:-true}
      RLM_PLUGIN_VERIFY_REQUIRED: ${RLM_PLUGIN_VERIFY_REQUIRED:-true}
      RLM_ACTIVATION_MODE: ${RLM_ACTIVATION_MODE:-complexity}
      RLM_CONFIG_PATH: /home/agent/.claude/rlm-config.json
      RLM_DEBUG: ${RLM_DEBUG:-0}
    secrets:
      - GH_TOKEN
    volumes:
      - repo_data:/workspace/repo
      - state_data:/workspace/state
      - ./logs:/workspace/logs
      - ${CLAUDE_CREDENTIALS_FILE}:/home/agent/.claude/.credentials.json:ro
      - codex_planner_home:/home/agent/.codex
      - ${CODEX_AUTH_FILE:-./secrets/codex/auth.json}:/run/secrets/codex/auth.json:ro
      - ${SIGNING_KEYS_PATH:-./secrets}:/mnt/host-keys:ro

  executor:
    build: .
    command: ["executor"]
    restart: unless-stopped
    environment:
      REPO_URL: ${REPO_URL}
      REPO_SLUG: ${REPO_SLUG}
      BASE_BRANCH: ${BASE_BRANCH:-main}
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL}
      #EXECUTOR_ID: ${EXECUTOR_ID:-executor-01}
      EXECUTOR_POLL_INTERVAL_SECONDS: ${EXECUTOR_POLL_INTERVAL_SECONDS:-60}
      MAX_TURNS_PER_RUN: ${EXECUTOR_MAX_TURNS:-100}
      AGENT_PROVIDER: ${AGENT_PROVIDER:-claude}
      EXECUTOR_PROVIDER: ${EXECUTOR_PROVIDER:-}
      EXECUTOR_MODEL: ${EXECUTOR_MODEL:-}
      AGENT_MODEL: ${AGENT_MODEL:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-}
      CLAUDE_SUBAGENTS_ENABLED: ${CLAUDE_SUBAGENTS_ENABLED:-false}
      VALIDATION_COMMAND: ${VALIDATION_COMMAND:-}
      GIT_COMMIT_SIGNING: ${GIT_COMMIT_SIGNING:-off}
      GIT_SIGNING_KEY: ${GIT_SIGNING_KEY:-}
      SIGNING_KEYS_MOUNT: /mnt/host-keys
      RLM_PLUGIN_ENABLED: ${RLM_PLUGIN_ENABLED:-true}
      RLM_PLUGIN_REQUIRED: ${RLM_PLUGIN_REQUIRED:-true}
      RLM_PLUGIN_REF: ${RLM_PLUGIN_REF:-rlm-claude-code@rlm-claude-code}
      RLM_PLUGIN_KEY: ${RLM_PLUGIN_KEY:-rlm-claude-code@rlm-claude-code}
      RLM_PLUGIN_NAME: ${RLM_PLUGIN_NAME:-rlm-claude-code}
      RLM_PLUGIN_SCOPE: ${RLM_PLUGIN_SCOPE:-user}
      RLM_MARKETPLACE_SOURCE: ${RLM_MARKETPLACE_SOURCE:-rand/rlm-claude-code}
      RLM_PLUGIN_BUILD_HOOKS: ${RLM_PLUGIN_BUILD_HOOKS:-true}
      RLM_PLUGIN_SYNC_REQUIRED: ${RLM_PLUGIN_SYNC_REQUIRED:-true}
      RLM_PLUGIN_VERIFY_REQUIRED: ${RLM_PLUGIN_VERIFY_REQUIRED:-true}
      RLM_ACTIVATION_MODE: ${RLM_ACTIVATION_MODE:-complexity}
      RLM_CONFIG_PATH: /home/agent/.claude/rlm-config.json
      RLM_DEBUG: ${RLM_DEBUG:-0}
    secrets:
      - GH_TOKEN
    volumes:
      - repo_data:/workspace/repo
      - worktrees_data:/workspace/worktrees
      - state_data:/workspace/state
      - ./logs:/workspace/logs
      - ${CLAUDE_CREDENTIALS_FILE}:/home/agent/.claude/.credentials.json:ro
      - codex_executor_home:/home/agent/.codex
      - ${CODEX_AUTH_FILE:-./secrets/codex/auth.json}:/run/secrets/codex/auth.json:ro
      - ${SIGNING_KEYS_PATH:-./secrets}:/mnt/host-keys:ro

volumes:
  repo_data:
  worktrees_data:
  state_data:
  codex_planner_home:
  codex_executor_home:

secrets:
  GH_TOKEN:
    environment: GH_TOKEN
